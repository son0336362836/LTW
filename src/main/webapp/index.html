
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murach's Java Servlets and JSP - Survey</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

<div class="survey-container">

    <div class="survey-header">
        <img src="images/murach.jpg" alt="Murach Logo">
        <h1>Survey</h1>
        <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
    </div>

    <form action="emailList" method="post">

        <input type="hidden" name="action" value="add">

        <fieldset>
            <legend>User Information</legend>

            <div class="form-row">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>

            <div class="form-row">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>

            <div class="form-row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-row">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>User Survey</legend>

            <div class="survey-question">
                <p class="question-title">How did you hear about us?</p>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="source" value="Search engine" checked>
                        Search engine
                    </label>

                    <label>
                        <input type="radio" name="source" value="Word of mouth">
                        Word of mouth
                    </label>

                    <label>
                        <input type="radio" name="source" value="Social Media">
                        Social Media
                    </label>

                    <label>
                        <input type="radio" name="source" value="Other">
                        Other
                    </label>
                </div>
            </div>

            <div class="survey-question">
                <p class="question-title">
                    Would you like to receive announcements about new CDs and special offers?
                </p>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="announcements" value="Yes">
                        YES, I'd like that.
                    </label>

                    <label>
                        <input type="checkbox" name="offers" value="Yes">
                        YES, please send me special offers.
                    </label>
                </div>
            </div>

            <div class="form-row contact-row">
                <label for="contactMethod">Please contact me by</label>

                <select id="contactMethod" name="contactMethod">
                    <option value="Email or postal mail">
                        Email or postal mail
                    </option>

                    <option value="Email only">
                        Email only
                    </option>

                    <option value="Postal mail only">
                        Postal mail only
                    </option>
                </select>
            </div>
        </fieldset>

        <div class="form-actions">
            <button type="submit">Submit Survey</button>
        </div>

    </form>

</div>

</body>
</html>
